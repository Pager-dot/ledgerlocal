[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlocal"
version = "0.1.0"
description = "Local-first invoice and receipt sorter for freelancers, powered by open-weight models."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Pager-dot" }]
keywords = ["invoice", "receipt", "ocr", "ollama", "local-first", "bookkeeping", "freelance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
]
# The runtime deliberately has zero required dependencies: stdlib only.
# Everything that talks to the model is plain urllib against localhost.
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
images = ["pillow>=10.0"]
all = ["pymupdf>=1.24", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ledgerlocal = "ledgerlocal.cli:main"

[project.urls]
Homepage = "https://github.com/Pager-dot/ledgerlocal"
Issues = "https://github.com/Pager-dot/ledgerlocal/issues"

[tool.hatch.build.targets.wheel]
packages = ["ledgerlocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
